name: musl
variant: scratch
dependencies:
  - stage: c
  - image: "stagex/diffutils@sha256:{{ .stagex_diffutils_sha256 }}"
  - image: "stagex/llvm"
  - image: "stagex/clang"
  - image: "stagex/lld"
  - image: "stagex/zlib"
steps:
  - sources:
      - url: https://www.musl-libc.org/releases/musl-{{ .musl_version }}.tar.gz
        destination: musl.tar.gz
        sha256: "{{ .musl_sha256 }}"
        sha512: "{{ .musl_sha512 }}"
    env:
      AR: "llvm-ar"
      AS: "llvm-as"
      NM: "llvm-nm"
      OBJDUMP: "llvm-objdump"
      RANLIB: "llvm-ranlib"
      READELF: "llvm-readelf"
      STRIP: "llvm-strip"
      OBJCOPY: "llvm-objcopy"
      LDFLAGS: "-fuse-ld=lld"
      CC: "clang --target=aarch64-linux-musl"
      CXX: "clang++ --target=aarch64-linux-musl"
    prepare:
      - |
        tar -xzf musl.tar.gz --strip-components=1

        patch -p1 < /pkg/patches/handle-aux-at-base.patch
        patch -p1 < /pkg/patches/close-range.patch

        mkdir build
        cd build

        ../configure --target=aarch64-linux-musl --prefix=/usr
    build:
      - |
        cd build
        make -j $(nproc)
    install:
      - |
        cd build
        make DESTDIR=/rootfs install
finalize:
  - from: /rootfs
    to: /
