name: gcc-arm
variant: scratch
dependencies:
  - image: "stagex/busybox@sha256:{{ .stagex_busybox_sha256 }}"
  - image: "stagex/make@sha256:{{ .stagex_make_sha256 }}"
  - image: "stagex/musl@sha256:{{ .stagex_musl_sha256 }}"
  - stage: gcc
  - image: "stagex/file@sha256:{{ .stagex_file_sha256 }}"
  - stage: binutils
  - stage: musl
    to: /sysroot
steps:
  - sources:
      - url: https://ftp.gnu.org/gnu/gcc/gcc-{{ .gcc_version }}/gcc-{{ .gcc_version }}.tar.xz
        destination: gcc.tar.xz
        sha256: "{{ .gcc_sha256 }}"
        sha512: "{{ .gcc_sha512 }}"
      - url: https://ftp.gnu.org/gnu/mpfr/mpfr-{{ .mpfr_version }}.tar.xz
        destination: mpfr.tar.xz
        sha256: "{{ .mpfr_sha256 }}"
        sha512: "{{ .mpfr_sha512 }}"
      - url: https://ftp.gnu.org/gnu/gmp/gmp-{{ .gmp_version }}.tar.xz
        destination: gmp.tar.xz
        sha256: "{{ .gmp_sha256 }}"
        sha512: "{{ .gmp_sha512 }}"
      - url: https://ftp.gnu.org/gnu/mpc/mpc-{{ .mpc_version }}.tar.gz
        destination: mpc.tar.gz
        sha256: "{{ .mpc_sha256 }}"
        sha512: "{{ .mpc_sha512 }}"
    prepare:
      - |
        echo 'int main(){}' > dummy.c
        aarch64-linux-musl-gcc -v dummy.c
        ./a.out

        mkdir mpfr
        tar -xJf mpfr.tar.xz --strip-components=1 -C mpfr

        mkdir gmp
        tar -xJf gmp.tar.xz --strip-components=1 -C gmp

        mkdir mpc
        tar -xzf mpc.tar.gz --strip-components=1 -C mpc

        tar -xJf gcc.tar.xz --strip-components=1
        mkdir build
        cd build

        cat ../gcc/limitx.h ../gcc/glimits.h ../gcc/limity.h > `dirname $(aarch64-linux-musl-gcc -print-libgcc-file-name)`/include-fixed/limits.h

        ../configure \
        --build=x86_64-linux-musl \
        --host=aarch64-linux-musl \
        --target=aarch64-linux-musl \
        --with-build-sysroot=/sysroot \
        --with-sysroot=/sysroot \
        --prefix=/usr \
        --disable-cet \
        --disable-fixed-point \
        --disable-libstdcxx-pch \
        --disable-multilib \
        --disable-libsanitizer \
        --disable-nls \
        --disable-werror \
        --enable-__cxa_atexit \
        --enable-default-pie \
        --enable-default-ssp \
        --enable-languages=c,c++ \
        --enable-link-serialization=2 \
        --enable-linker-build-id || cat config.log
    build:
      - |
        cd build
        make -j $(nproc)
    install:
      - |
        cd build
        make DESTDIR=/rootfs install-gcc
        make DESTDIR=/rootfs install-target-libgcc
        # make DESTDIR=/rootfs install-target-libstdc++-v3
        ln -sv gcc /rootfs/usr/bin/cc
finalize:
  - from: /rootfs
    to: /
