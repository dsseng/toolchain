name: gcc
variant: scratch
dependencies:
  - stage: c
  - image: "stagex/file@sha256:{{ .stagex_file_sha256 }}"
  - stage: binutils
  - stage: musl
    to: /sysroot
steps:
  - sources:
      - url: https://ftp.gnu.org/gnu/gcc/gcc-{{ .gcc_version }}/gcc-{{ .gcc_version }}.tar.xz
        destination: gcc.tar.xz
        sha256: "{{ .gcc_sha256 }}"
        sha512: "{{ .gcc_sha512 }}"
      - url: https://ftp.gnu.org/gnu/mpfr/mpfr-{{ .mpfr_version }}.tar.xz
        destination: mpfr.tar.xz
        sha256: "{{ .mpfr_sha256 }}"
        sha512: "{{ .mpfr_sha512 }}"
      - url: https://ftp.gnu.org/gnu/gmp/gmp-{{ .gmp_version }}.tar.xz
        destination: gmp.tar.xz
        sha256: "{{ .gmp_sha256 }}"
        sha512: "{{ .gmp_sha512 }}"
      - url: https://ftp.gnu.org/gnu/mpc/mpc-{{ .mpc_version }}.tar.gz
        destination: mpc.tar.gz
        sha256: "{{ .mpc_sha256 }}"
        sha512: "{{ .mpc_sha512 }}"
    prepare:
      - |
        mkdir mpfr
        tar -xJf mpfr.tar.xz --strip-components=1 -C mpfr

        mkdir gmp
        tar -xJf gmp.tar.xz --strip-components=1 -C gmp

        mkdir mpc
        tar -xzf mpc.tar.gz --strip-components=1 -C mpc

        tar -xJf gcc.tar.xz --strip-components=1
        mkdir build
        cd build

        cat ../gcc/limitx.h ../gcc/glimits.h ../gcc/limity.h > `dirname $(gcc -print-libgcc-file-name)`/include-fixed/limits.h

        ../configure \
        --disable-libssp \
        --build=x86_64-linux-musl \
        --host=x86_64-linux-musl \
        --target=aarch64-linux-musl \
        --with-build-sysroot=/sysroot \
        --with-sysroot=/rootfs/usr/sysroot \
        --prefix=/usr \
        --disable-multilib \
        --disable-bootstrap \
        --disable-assembly \
        --disable-libmudflap \
        --disable-libsanitizer \
        --disable-gnu-indirect-function \
        --disable-libmpx \
        --disable-werror \
        --enable-languages=c,c++ \
        --enable-tls \
        --enable-initfini-array \
        --enable-libstdcxx-time=rt \
        --enable-deterministic-archives \
        # AR_FOR_TARGET=llvm-ar \
        # AS_FOR_TARGET=llvm-as \
        # LD_FOR_TARGET=llvm-ld \
        # NM_FOR_TARGET=llvm-nm \
        # OBJCOPY_FOR_TARGET=llvm-objcopy \
        # OBJDUMP_FOR_TARGET=llvm-objdump \
        # RANLIB_FOR_TARGET=llvm-ranlib \
        # READELF_FOR_TARGET=llvm-readelf \
        # STRIP_FOR_TARGET=llvm-strip
        AR_FOR_TARGET=/usr/bin/aarch64-linux-musl-ar \
        AS_FOR_TARGET=/usr/bin/aarch64-linux-musl-as \
        LD_FOR_TARGET=/usr/bin/aarch64-linux-musl-ld \
        NM_FOR_TARGET=/usr/bin/aarch64-linux-musl-nm \
        OBJCOPY_FOR_TARGET=/usr/bin/aarch64-linux-musl-objcopy \
        OBJDUMP_FOR_TARGET=/usr/bin/aarch64-linux-musl-objdump \
        RANLIB_FOR_TARGET=/usr/bin/aarch64-linux-musl-ranlib \
        READELF_FOR_TARGET=/usr/bin/aarch64-linux-musl-readelf \
        STRIP_FOR_TARGET=/usr/bin/aarch64-linux-musl-strip

        make -j $(nproc) all-gcc
    build:
      - |
        cd build
        make -j $(nproc) all-target-libgcc
      # - |
      #   cd build
      #   make -j $(nproc) all-target-libstdc++-v3
    install:
      - |
        cd build
        make DESTDIR=/rootfs install-gcc
        make DESTDIR=/rootfs install-target-libgcc
        # make DESTDIR=/rootfs install-target-libstdc++-v3
        ln -sv gcc /rootfs/usr/bin/cc
finalize:
  - from: /rootfs
    to: /
